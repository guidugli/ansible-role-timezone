---
argument_specs:
  main:
    short_description: Configure the system timezone.
    description:
      - Installs timezone data and configures the host IANA timezone.
      - Privilege escalation is intentionally controlled by the caller.
    options:
      timezone_name:
        type: str
        required: false
        default: America/Sao_Paulo
        description:
          - IANA time zone name to configure, such as C(America/Sao_Paulo) or C(UTC).
      timezone_hwclock:
        type: str
        required: false
        choices:
          - UTC
          - local
        description:
          - Optional hardware clock mode.
          - Leave undefined to preserve the current hardware clock setting.
