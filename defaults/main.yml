---
# defaults file for timezone

# IANA time zone name to configure on the target host.
# See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone_name: America/Sao_Paulo

# Optional hardware clock setting. Leave undefined to keep the existing setting.
# Valid values: UTC, local
# Note: Changing the hardware clock mode may not be supported or desired in
# virtualized and cloud environments.
# timezone_hwclock: UTC
